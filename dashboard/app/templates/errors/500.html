{% extends "base.html" %}

{% block title %}Server Error - Secret Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="empty-state">
            <i class="bi bi-x-octagon display-1 text-danger"></i>
            <h1 class="display-4">500</h1>
            <h3>Internal Server Error</h3>
            <p class="text-muted">Something went wrong on our end. We've been notified and are working on it.</p>
            <a href="{{ url_for('user.dashboard') if session.get('user') else url_for('index') }}" class="btn btn-primary mt-3">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
